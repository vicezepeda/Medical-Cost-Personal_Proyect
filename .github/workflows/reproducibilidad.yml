name: Verificación reproducible
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - 'requirements.txt'
      - 'notebooks/**'
      - 'dashboard/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar entorno
        run: python -m pip install -r requirements.txt
      - name: Ejecutar análisis completo
        run: python -m src.analysis
      - name: Verificar artefactos recién reproducidos
        run: python -m pytest -q
      - name: Exportar dashboard
        run: python dashboard/app.py --export
      - uses: actions/upload-artifact@v4
        with:
          name: resultados-reproducidos
          path: |
            results/
            dashboard/index.html
          retention-days: 30
